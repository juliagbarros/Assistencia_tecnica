services:
  postgres:
    image: postgres:16-alpine
    container_name: assistencia_postgres
    environment:
      POSTGRES_DB: assistencia
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d assistencia" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
