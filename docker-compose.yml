services:
  angular:
    build: ./frontend
    container_name: assistencia_frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - angular_deps:/app/node_modules
  

  postgres:
    image: postgres:16-alpine
    container_name: assistencia_postgres
    environment:
      POSTGRES_DB: assistencia
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d assistencia" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  angular_deps:
  postgres_data:
