
<section class="pagina-aparelhos">

    <nav class="caminho" aria-label="Caminho de navegação">
        <span>Início</span>
        <span>›</span>
        <span>Aparelhos</span>
    </nav>

    <app-tabela
        titulo="Aparelhos"
        descricao="Visualize e gerencie os aparelhos cadastrados na assistência."
        placeholderBusca="Pesquisar cliente, marca ou modelo..."
        textoAdicionar="Adicionar aparelho"
        [colunas]="colunas"
        [registros]="registros()"
        (adicionar)="adicionarAparelho()"
        (editar)="editarAparelho($event)"
        (remover)="removerAparelho($event)">

        <div resumo class="indicadores">

          

        </div>
    </app-tabela>

    @if (modalAberto()) {
        <app-modal
            [titulo]="aparelhoSelecionado() ? 'Editar aparelho' : 'Cadastrar aparelho'"
            [descricao]="aparelhoSelecionado() ? 'Atualize as informações do aparelho.' : 'Preencha as informações do novo aparelho.'"
            (fechar)="fecharModal()">

            <app-formulario-aparelho
                [aparelho]="aparelhoSelecionado()"
                (salvar)="salvarAparelho($event)"
                (cancelar)="fecharModal()">
            </app-formulario-aparelho>

        </app-modal>
    }

    @if (mensagem()) {
        <p class="mensagem" role="status">{{ mensagem() }}</p>
    }

</section>
