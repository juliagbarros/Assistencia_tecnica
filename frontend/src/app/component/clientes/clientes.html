
<section class="pagina-clientes">

    <nav class="caminho" aria-label="Caminho de navegação">
        <a routerLink="/painel">Início</a>
        <span>›</span>
        <span>Clientes</span>
    </nav>

    <app-tabela
        titulo="Clientes"
        descricao="Visualize e gerencie os clientes cadastrados"
        placeholderBusca="Digite o nome do cliente..."
        textoAdicionar="Adicionar cliente"
        [colunas]="colunas"
        [registros]="registros()"
        (adicionar)="adicionarCliente()"
        (editar)="editarCliente($event)"
        (remover)="removerCliente($event)">

        <div resumo class="indicadores">

     

        </div>

    </app-tabela>

    @if (modalAberto()) {

        <app-modal
            [titulo]="clienteSelecionado() ? 'Editar cliente' : 'Cadastrar cliente'"
            [descricao]="clienteSelecionado() ? 'Atualize as informações do cliente.' : 'Preencha as informações do novo cliente.'"
            (fechar)="fecharModal()">

            <app-formulario-cliente
                [cliente]="clienteSelecionado()"
                (salvar)="salvarCliente($event)"
                (cancelar)="fecharModal()">
            </app-formulario-cliente>

        </app-modal>

    }

    @if (mensagem()) {
        <p class="mensagem" role="status">
            {{ mensagem() }}
        </p>
    }

</section>
