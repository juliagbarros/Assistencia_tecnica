
<section class="pagina-ordens">

    <nav class="caminho" aria-label="Caminho de navegação">
        <a routerLink="/painel">Início</a>
        <span>›</span>
        <span>Ordens</span>
    </nav>

    <app-tabela
        titulo="Ordens de Serviço"
        descricao="Visualize e gerencie as ordens de serviço da assistência."
        placeholderBusca="Pesquisar número da OS, cliente ou aparelho..."
        textoAdicionar="Adicionar ordem"
        [colunas]="colunas"
        [registros]="registros()"
        (adicionar)="adicionarOrdem()"
        (editar)="editarOrdem($event)"
        (remover)="removerOrdem($event)"
        [exibirDetalhes]="true"
        (visualizar)="visualizarOrdem($event)"
        >
        
        <div resumo class="indicadores">

         

        </div>
    </app-tabela>

    @if (modalAberto()) {
        <app-modal
            [titulo]="ordemSelecionada() ? 'Editar ordem' : 'Cadastrar ordem'"
            [descricao]="ordemSelecionada() ? 'Atualize as informações da ordem de serviço.' : 'Preencha as informações da nova ordem de serviço.'"
            (fechar)="fecharModal()">

            <app-formulario-ordem
                [ordem]="ordemSelecionada()"
                (salvar)="salvarOrdem($event)"
                (cancelar)="fecharModal()">
            </app-formulario-ordem>

        </app-modal>
    }

    @if (mensagem()) {
        <p class="mensagem" role="status">{{ mensagem() }}</p>
    }

</section>
