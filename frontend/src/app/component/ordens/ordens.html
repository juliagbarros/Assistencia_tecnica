<section class="pagina-ordens">

    <nav class="caminho" aria-label="Caminho de navegação">
        <a routerLink="/painel">Início</a>
        <span>›</span>
        <span>Ordens de Serviço</span>
    </nav>

    <app-tabela
        titulo="Ordens de Serviço"
        descricao="Acompanhe os reparos e atendimentos da assistência."
        placeholderBusca="Pesquisar ordens de serviço..."
        textoAdicionar="Nova OS"

        [colunas]="colunas"
        [registros]="ordens()"

        (adicionar)="adicionarOrdem()"
        (editar)="editarOrdem($event)"
        (remover)="removerOrdem($event)">

        <div resumo class="indicadores">

            <div class="card-indicador">

                <div class="icone-indicador azul">
                    <svg lucideClipboardList [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ totalOrdens() }}</h3>
                    <p>Total de ordens</p>
                </div>

            </div>

            <div class="card-indicador">

                <div class="icone-indicador amarelo">
                    <svg lucideClock3 [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ ordensAbertas() }}</h3>
                    <p>Ordens abertas</p>
                </div>

            </div>

            <div class="card-indicador">

                <div class="icone-indicador roxo">
                    <svg lucideWrench [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ ordensEmAtendimento() }}</h3>
                    <p>Em atendimento</p>
                </div>

            </div>

            <div class="card-indicador">

                <div class="icone-indicador verde">
                    <svg lucideCircleCheck [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ ordensConcluidas() }}</h3>
                    <p>Concluídas / entregues</p>
                </div>

            </div>

        </div>

    </app-tabela>

    @if (mensagem()) {
        <p class="mensagem" role="status">
            {{ mensagem() }}
        </p>
    }

</section>
