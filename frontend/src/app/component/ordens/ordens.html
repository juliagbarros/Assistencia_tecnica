
<section class="pagina-ordens">

    <nav class="caminho" aria-label="Caminho de navegação">
        <a routerLink="/painel">Início</a>
        <span>›</span>
        <span>Ordens</span>
    </nav>

    <app-tabela
        titulo="Ordens de Serviço"
        descricao="Visualize e gerencie as ordens de serviço da assistência."
        placeholderBusca="Pesquisar número da OS, cliente ou aparelho..."
        textoAdicionar="Adicionar ordem"
        [colunas]="colunas"
        [registros]="ordens()"
        (adicionar)="adicionarOrdem()"
        (editar)="editarOrdem($event)"
        (remover)="removerOrdem($event)">

        <div resumo class="indicadores">

            <div class="card-indicador">

                <div class="icone-indicador azul">
                    <svg lucideClipboardList [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ totalOrdens() }}</h3>
                    <p>Total de ordens</p>
                </div>

            </div>

            <div class="card-indicador">

                <div class="icone-indicador verde">
                    <svg lucideClock3 [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ ordensAbertas() }}</h3>
                    <p>Ordens abertas</p>
                </div>

            </div>

            <div class="card-indicador">

                <div class="icone-indicador amarelo">
                    <svg lucideWrench [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ ordensEmAtendimento() }}</h3>
                    <p>Em atendimento</p>
                </div>

            </div>

            <div class="card-indicador">

                <div class="icone-indicador roxo">
                    <svg lucideCircleCheck [size]="24"></svg>
                </div>

                <div class="dados-indicador">
                    <h3>{{ ordensConcluidas() }}</h3>
                    <p>Ordens concluídas</p>
                </div>

            </div>

        </div>

    </app-tabela>

    @if (modalAberto()) {

        <app-modal
            [titulo]="ordemSelecionada() ? 'Editar ordem' : 'Cadastrar ordem'"
            [descricao]="ordemSelecionada() ? 'Atualize as informações da ordem de serviço.' : 'Preencha as informações da nova ordem de serviço.'"
            (fechar)="fecharModal()">

            <app-formulario-ordem
                [ordem]="ordemSelecionada()"
                (salvar)="salvarOrdem($event)"
                (cancelar)="fecharModal()">
            </app-formulario-ordem>

        </app-modal>

    }

    @if (mensagem()) {
        <p class="mensagem" role="status">
            {{ mensagem() }}
        </p>
    }

</section>
