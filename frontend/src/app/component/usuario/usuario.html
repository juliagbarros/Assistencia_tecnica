
<section class="pagina-usuarios">

    <app-tabela
        titulo="Gerenciamento de usuários"
        descricao="Consulte, cadastre e gerencie os usuários do sistema."
        placeholderBusca="Pesquisar por nome ou e-mail..."
        textoAdicionar="Adicionar usuário"
        [colunas]="colunas"
        [registros]="registros()"
        (adicionar)="adicionarUsuario()"
        (editar)="editarUsuario($event)"
        (remover)="removerUsuario($event)">
    </app-tabela>

    @if (modalAberto()) {

        <app-modal
            [titulo]="usuarioSelecionado() ? 'Editar usuário' : 'Cadastrar usuário'"
            [descricao]="usuarioSelecionado() ? 'Altere os dados do usuário.' : 'Informe os dados do novo usuário.'"
            (fechar)="fecharModal()">

            @if (erro()) {
                <p class="mensagem-erro" role="alert">
                    {{ erro() }}
                </p>
            }

            <app-formulario-usuario
                [usuario]="usuarioSelecionado()"
                (salvar)="salvarUsuario($event)"
                (cancelar)="fecharModal()">
            </app-formulario-usuario>

        </app-modal>
    }

    @if (mensagem()) {
        <p class="mensagem-sucesso" role="status">
            {{ mensagem() }}
        </p>
    }

</section>
