<header class="topbar">

    <a class="logo" routerLink="/clientes">
        <div class="logo-icone">
            <svg lucideSmartphone [size]="24"></svg>
        </div>

        <h2>Tech<span>Repair</span></h2>
    </a>

    <div class="busca-global">
        <svg lucideSearch [size]="20"></svg>

        <input
            type="search"
            placeholder="Busca global (em breve)"
            aria-label="Busca global"
            >
    </div>

    <div class="usuario">


        <div class="usuario-avatar">
            <svg lucideUserRound [size]="23"></svg>
        </div>

        <div class="usuario-dados">
            <strong>Administrador</strong>
            <span>admin@techrepair.com</span>
        </div>

    </div>

</header>
